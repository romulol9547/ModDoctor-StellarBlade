<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ModDoctor Stellar Blade</title>
<style>
  :root{--bg:#14161b;--card:#1d2027;--card2:#242832;--txt:#e8eaf0;--mut:#9aa1b2;--acc:#35d0e8;--ok:#4cd68a;--warn:#f2b84b;--bad:#ff6b6b;--line:#2f3441}
  @media (prefers-color-scheme: light){:root{--bg:#f4f6fa;--card:#fff;--card2:#eef1f7;--txt:#1c2030;--mut:#5d6578;--acc:#0a8aa3;--ok:#1a9b5b;--warn:#b57a00;--bad:#d03a3a;--line:#d9deea}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:24px;margin:0}
  h1 small{display:block;font-size:13px;color:var(--mut);font-weight:400}
  h2{font-size:17px;margin:0 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .lang button{background:var(--card2);color:var(--txt);border:1px solid var(--line);padding:6px 12px;cursor:pointer}
  .lang button:first-child{border-radius:8px 0 0 8px}.lang button:last-child{border-radius:0 8px 8px 0}
  .lang button.on{background:var(--acc);color:#06222a;border-color:var(--acc);font-weight:600}
  button.main{background:var(--acc);color:#06222a;border:0;border-radius:8px;padding:9px 15px;font-weight:600;cursor:pointer;font-size:14px}
  button.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 15px;cursor:pointer;font-size:14px}
  button:disabled{opacity:.5;cursor:default}
  .muted{color:var(--mut)} .small{font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .stat{background:var(--card2);border-radius:10px;padding:10px 12px}
  .stat b{display:block;font-size:22px}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600}
  .pill.ok{background:rgba(76,214,138,.15);color:var(--ok)}.pill.off{background:rgba(154,161,178,.18);color:var(--mut)}
  .pill.warn{background:rgba(242,184,75,.18);color:var(--warn)}.pill.bad{background:rgba(255,107,107,.18);color:var(--bad)}
  .item{border-left:4px solid var(--line);background:var(--card2);border-radius:8px;padding:9px 12px;margin:8px 0}
  .item.warn{border-color:var(--warn)}.item.bad{border-color:var(--bad)}.item.info{border-color:var(--acc)}.item.ok{border-color:var(--ok)}
  .item b{display:block}
  code{background:var(--card2);padding:1px 5px;border-radius:4px;font-size:13px;word-break:break-all}
  a{color:var(--acc)}
  ol{padding-left:20px;margin:6px 0}
  .hide{display:none}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ModDoctor Stellar Blade <small id="tagline"></small></h1>

let LANG = (navigator.language || '').toLowerCase().startsWith('pt') ? 'pt' : 'en';
try { const s = localStorage.getItem('moddoctor-lang'); if (s === 'pt' || s === 'en') LANG = s; } catch (e) {}
const t = (k, vars) => { let s = (I18N[LANG][k] ?? I18N.en[k] ?? k); if (vars) for (const v in vars) s = s.split('%' + v).join(vars[v]); return s; };

/* ---------- state ---------- */
let gameDir = null, crashDir = null;
let lastReport = null, INFO = null, cardMsg = '', serverGone = false;

/* ---------- link to ModDoctor.exe (local server) ---------- */
const TOKEN = new URLSearchParams(location.search).get('t') || '';
async function api(path, params = {}, opts) {
  const r = await fetch(path + '?' + new URLSearchParams({ t: TOKEN, ...params }), opts);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r;
}
const join = (a, b) => a ? a + '/' + b : b;
class RFile {
  constructor(root, p, size, mtime) { this.root = root; this.p = p; this.size = size; this.lastModified = mtime; }
  async text() { return (await api('/api/file', { root: this.root, p: this.p })).text(); }
}
class RFileHandle {
  constructor(root, p, meta) { this.kind = 'file'; this.root = root; this.p = p; this.meta = meta; }
  async getFile() { const m = this.meta || await (await api('/api/stat', { root: this.root, p: this.p })).json(); return new RFile(this.root, this.p, m.size, m.mtime); }
}
class RDirHandle {
  constructor(root, p) { this.kind = 'directory'; this.root = root; this.p = p; }
  async *entries() {
    const list = await (await api('/api/list', { root: this.root, p: this.p })).json();
    for (const e of list) { const p = join(this.p, e.name); yield [e.name, e.kind === 'directory' ? new RDirHandle(this.root, p) : new RFileHandle(this.root, p, e)]; }
  }
  async getDirectoryHandle(n) { const p = join(this.p, n); const m = await (await api('/api/stat', { root: this.root, p })).json(); if (m.kind !== 'directory') throw new TypeError('not a folder'); return new RDirHandle(this.root, p); }
  async getFileHandle(n) { const p = join(this.p, n); const m = await (await api('/api/stat', { root: this.root, p })).json(); if (m.kind !== 'file') throw new TypeError('not a file'); return new RFileHandle(this.root, p, m); }
}

/* ---------- small helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const stripAnsi = s => s.replace(/\x1b?\[\d+(?:;\d+)*m/g, '');

async function listDir(dir) {
  const out = [];
  try { for await (const [name, h] of dir.entries()) out.push({ name, kind: h.kind, handle: h }); } catch (e) {}
  return out;
}
async function getDir(dir, name) { try { return await dir.getDirectoryHandle(name); } catch (e) { return null; } }
async function getFile(dir, name) { try { const fh = await dir.getFileHandle(name); return await fh.getFile(); } catch (e) { return null; } }
async function readText(dir, name) { const f = await getFile(dir, name); return f ? await f.text() : null; }
async function walkDirs(dir, path, fn, depth = 0) {      // calls fn(name, file) for every file
  for (const e of await listDir(dir)) {
    if (e.kind === 'file') { try { await fn(path + e.name, await e.handle.getFile()); } catch (x) {} }
    else if (depth < 6) await walkDirs(e.handle, path + e.name + '/', fn, depth + 1);
  }
}
async function resolvePath(dir, parts) { let d = dir; for (const p of parts) { d = await getDir(d, p); if (!d) return null; } return d; }

/* ---------- locate folders (the program already gives the game root) ---------- */
async function findUe4ss(root) { return await resolvePath(root, ['SB', 'Binaries', 'Win64', 'ue4ss']); }
async function findModsPak(root) { return await resolvePath(root, ['SB', 'Content', 'Paks', '~mods']); }

/* ---------- scanning ---------- */
function parseModsTxt(text) {
  const map = {};
  (text || '').split(/\r?\n/).forEach(l => {
    const line = l.split(';')[0].trim(); if (!line) return;
    const m = line.match(/^(.+?)\s*:\s*([01])\s*$/); if (m) map[m[1].trim()] = m[2] === '1';
  });
  return map;
}
function findKeys(src) {
  const keys = new Set();
  let m; const re1 = /RegisterKeyBind\(\s*Key\.([A-Z0-9_]+)/g;
  while ((m = re1.exec(src))) keys.add(m[1]);
  const re2 = /\b(?:\w*Key\w*|\w*Tecla\w*|\w*Hotkey\w*)\s*=\s*["']([A-Za-z0-9_]{2,16})["']/g;
  while ((m = re2.exec(src))) { const k = m[1]; if (/^(F\d{1,2}|NumPad\w+|NUM_\w+|[A-Z]|Insert|Delete|Home|End|PageUp|PageDown|Tab|Backspace|Gamepad_\w+)$/i.test(k)) keys.add(normKey(k)); }
  return [...keys].map(normKey);
}
function normKey(k) { return String(k).toUpperCase().replace(/^NUMPAD(\w+)$/, (a, b) => 'NUM_' + b).replace('NUM_SIX', 'NUM_6').replace('NUM_FIVE', 'NUM_5'); }

async function scanUe4ssMods(ue4ss) {
  const modsDir = await getDir(ue4ss, 'Mods'); const mods = [];
  if (!modsDir) return { mods, modsTxt: {} };
  const modsTxt = parseModsTxt(await readText(modsDir, 'mods.txt'));
  for (const e of await listDir(modsDir)) {
    if (e.kind !== 'directory') continue;
    const m = { name: e.name, type: 'lua', enabled: false, luaFiles: 0, codeKB: 0, keys: [], hasScripts: false };
    const hasEnabledTxt = !!(await getFile(e.handle, 'enabled.txt'));
    m.enabled = (e.name in modsTxt) ? modsTxt[e.name] : hasEnabledTxt;
    if (hasEnabledTxt && !(e.name in modsTxt)) m.enabled = true;
    const scripts = await getDir(e.handle, 'Scripts');
    m.hasScripts = !!scripts;
    if (scripts) {
      let bytes = 0;
      await walkDirs(scripts, '', async (name, f) => {
        if (!/\.lua$/i.test(name)) return;
        m.luaFiles++; bytes += f.size;
        if (f.size < 3_000_000) { const src = await f.text(); for (const k of findKeys(src)) if (!m.keys.includes(k)) m.keys.push(k); }
      });
      m.codeKB = Math.round(bytes / 1024);
    }
    mods.push(m);
  }
  return { mods, modsTxt };
}
async function scanPaks(root) {
  const dir = await findModsPak(root); const out = { paks: [], cns: [], found: !!dir };
  if (!dir) return out;
  for (const e of await listDir(dir)) {
    if (e.kind !== 'file') continue;
    const f = await e.handle.getFile();
    if (/\.pak$/i.test(e.name)) out.paks.push({ name: e.name, sizeMB: +(f.size / 1048576).toFixed(1) });
    else if (/\.dekcns\.json$/i.test(e.name)) out.cns.push({ name: e.name });
  }
  return out;
}

/* ---------- log analysis ---------- */
const ERR_RE = /(attempt to (?:index|call|compare|perform|concatenate|get length)[^\n]*|stack traceback|Error executing|\blua error\b|\[Lua\][^\n]*\bError\b\s*[:\-]|Lua Error|Failed to execute|exception thrown)/i;
function analyzeLog(text) {
  const clean = stripAnsi(text); const lines = clean.split(/\r?\n/);
  const res = { lines: lines.length, date: '', errors: [], errorsByMod: {}, ftext: false, last: lines.filter(l => l.trim()).slice(-8) };
  const d = clean.match(/\[(\d{4}-\d{2}-\d{2}) [\d:.]+\]/); if (d) res.date = d[1];
  for (const l of lines) {
    if (/Failed to find FText::FText/i.test(l)) res.ftext = true;
    if (ERR_RE.test(l) && !/Applied Preset|FText::FText|expected at least one value/i.test(l)) {
      let mod = '?';
      const m1 = l.match(/Mods[\\/]+([^\\/]+)[\\/]+Scripts/i); if (m1) mod = m1[1];
      else { const m2 = l.match(/\[Lua\]\s*\[([^\]]{2,40})\]/); if (m2) mod = m2[1]; }
      res.errors.push({ mod, line: l.slice(0, 260) });
      res.errorsByMod[mod] = (res.errorsByMod[mod] || 0) + 1;
    }
  }
  return res;
}

/* ---------- crash reports ---------- */
async function scanCrashes(dir) {
  const out = [];
  for (const e of await listDir(dir)) {
    if (e.kind !== 'directory') continue;
    const f = await getFile(e.handle, 'CrashContext.runtime-xml'); if (!f) continue;
    const xml = await f.text();
    const err = (xml.match(/<ErrorMessage>([\s\S]*?)<\/ErrorMessage>/) || [])[1] || '';
    const secs = parseInt((xml.match(/<SecondsSinceStart>(\d+)</) || [])[1] || '-1', 10);
    const threads = xml.match(/<Thread>[\s\S]*?<\/Thread>/g) || [];
    const gt = threads.find(x => /<ThreadName>GameThread</.test(x)) || xml;
    const inUe4ss = /\bUE4SS\s+0x/i.test(gt);
    let kind = 'other';
    if (/EXCEPTION_ACCESS_VIOLATION/i.test(err)) kind = 'access'; else if (/0xe06d7363/i.test(err)) kind = 'cpp';
    out.push({ when: f.lastModified, secs, kind, inUe4ss, err: err.replace(/^.*Unhandled Exception:\s*/, '').slice(0, 120) });
  }
  out.sort((a, b) => b.when - a.when);
  return out;
}

/* ---------- conflicts ---------- */
function findProblems(mods, modsTxt, log, crashes, hasUe4ss) {
  const items = [];
  if (!hasUe4ss) items.push({ lvl: 'info', title: t('noUe4ss'), text: t('noUe4ssD') });
  const onMods = mods.filter(m => m.enabled);
  const byKey = {};
  for (const m of onMods) for (const k of m.keys) (byKey[k] = byKey[k] || []).push(m.name);
  for (const k in byKey) if (byKey[k].length > 1) items.push({ lvl: 'warn', title: t('cKey'), text: t('cKeyD', { k, m: byKey[k].join(', ') }) });
  for (const n in modsTxt) if (modsTxt[n] && !mods.find(m => m.name === n)) items.push({ lvl: 'warn', title: t('cMissing'), text: t('cMissingD', { m: n }) });
  for (const m of mods) if (m.hasScripts && !m.enabled && !/^(shared|Keybinds|BPModLoaderMod|BPML_GenericFunctions)$/i.test(m.name)) items.push({ lvl: 'info', title: t('cNotLoaded'), text: t('cNotLoadedD', { m: m.name }) });
  const onScripts = onMods.filter(m => m.hasScripts).length;
  if (onScripts >= 6) items.push({ lvl: 'warn', title: t('cMany'), text: t('cManyD', { n: onScripts }) });
  if (log && log.ftext) items.push({ lvl: 'warn', title: t('cFtext'), text: t('cFtextD') });
  if (crashes && crashes.length >= 3) { const u = crashes.filter(c => c.inUe4ss).length; if (u / crashes.length >= 0.6) items.push({ lvl: 'bad', title: t('cCrashU'), text: t('cCrashUD', { a: u, b: crashes.length }) }); }
  for (const m of onMods) if (m.codeKB >= 250) items.push({ lvl: 'info', title: t('cHooks'), text: t('cHooksD', { m: m.name, k: m.codeKB }) });
  return items;
}

/* ---------- rendering ---------- */
const fmtDate = ms => new Date(ms).toLocaleString(LANG === 'pt' ? 'pt-BR' : 'en-GB');
const fmtPlayed = s => s < 0 ? '?' : (s >= 120 ? Math.round(s / 60) + ' ' + t('min') : s + ' ' + t('sec'));
const nexusLink = n => 'https://www.nexusmods.com/games/stellarblade/mods?keyword=' + encodeURIComponent(n);
const METHOD = { registry: 'mRegistry', steamlib: 'mSteamlib', shortcut: 'mShortcut', disk: 'mDisk', launcher: 'mLauncher', process: 'mProcess', history: 'mHistory', picked: 'mPicked', flag: 'mFlag' };

function renderGameCard() {
  const C = document.getElementById('gameCard');
  let h = `<h2>${t('gameTitle')}</h2>`;
  if (serverGone) h += `<div class="item bad">${t('serverGone')}</div>`;
  else if (!INFO) h += `<p class="muted">${t('looking')}</p>`;
  else if (INFO.game) {
    h += `<div class="item ok"><b>${t('foundAt')}</b><code>${esc(INFO.game)}</code> <span class="small muted">(${t(METHOD[INFO.method] || 'mDisk')})</span></div>`;
    h += `<p class="small muted">${t('crashAt')} ${INFO.crash ? `<code>${esc(INFO.crash)}</code>` : t('crashNoDir')}</p>`;
    h += `<div class="row"><button class="main" id="btnRescan" onclick="runScan()">${t('btnRescan')}</button><button class="sec" id="btnPick" onclick="pickOther()">${t('btnPick')}</button></div>`;
  } else {
    h += `<div class="item warn">${t('notFoundAuto')}</div><div class="row"><button class="main" id="btnPick" onclick="pickOther()">${t('btnPickFirst')}</button></div>`;
  }
  if (cardMsg) h += `<p class="small" style="color:var(--warn)">${esc(t(cardMsg))}</p>`;
  h += `<p class="small muted">${t('privacy')}</p>`;
  C.innerHTML = h;
}

function render(r) {
  const R = document.getElementById('results'); R.classList.remove('hide');
  const onCount = r.mods.filter(m => m.enabled).length;
  let h = '';
  h += `<div class="card"><h2>${t('sumTitle')}</h2><div class="grid">
    <div class="stat"><b>${r.mods.length}</b>${t('sLua')} (${onCount} ${t('sLuaOn')})</div>
    <div class="stat"><b>${r.pak.paks.length}</b>${t('sPak')}</div>
    <div class="stat"><b>${r.pak.cns.length}</b>${t('sCns')}</div>
    <div class="stat"><b>${r.log ? r.log.errors.length : '-'}</b>${t('sErr')}</div>
    <div class="stat"><b>${r.crashes ? r.crashes.length : '0'}</b>${t('sCrash')}</div></div></div>`;

  h += `<div class="card"><h2>${t('confTitle')}</h2>`;
  h += r.problems.length ? r.problems.map(p => `<div class="item ${p.lvl}"><b>${esc(p.title)}</b>${esc(p.text)}</div>`).join('') : `<div class="item ok">${t('noConf')}</div>`;
  h += `</div>`;

  h += `<div class="card"><h2>${t('modsTitle')}</h2><div class="tbl"><table><tr><th>${t('colName')}</th><th>${t('colType')}</th><th>${t('colStatus')}</th><th>${t('colInfo')}</th><th>${t('colNexus')}</th></tr>`;
  for (const m of r.mods) {
    const status = m.enabled ? `<span class="pill ok">${t('on')}</span>` : (m.hasScripts ? `<span class="pill off">${t('notLoaded')}</span>` : `<span class="pill off">${t('off')}</span>`);
    const info = `${m.luaFiles} lua, ${m.codeKB} KB` + (m.keys.length ? ` · ${t('keyWord')}: ${esc(m.keys.join(', '))}` : '');
    h += `<tr><td><b>${esc(m.name)}</b></td><td>${t('typeLua')}</td><td>${status}</td><td class="small muted">${info}</td><td><a target="_blank" rel="noopener" href="${nexusLink(m.name)}">${t('searchNexus')}</a></td></tr>`;
  }
  for (const p of r.pak.paks) h += `<tr><td><b>${esc(p.name)}</b></td><td>${t('typePak')}</td><td><span class="pill ok">${t('on')}</span></td><td class="small muted">${p.sizeMB} MB</td><td><a target="_blank" rel="noopener" href="${nexusLink(p.name.replace(/(_P)?\.pak$/i, ''))}">${t('searchNexus')}</a></td></tr>`;
  h += `</table></div>`;
  if (r.pak.paks.length || r.pak.found) h += `<p class="small muted">${t('pakNote')}</p>`;
  if (r.pak.cns.length) h += `<p class="small muted">${t('sCns')}: ${r.pak.cns.length}</p>`;
  h += `</div>`;

  h += `<div class="card"><h2>${t('logTitle')}</h2>`;
  if (!r.log) h += `<p class="muted">${t('logNone')}</p>`;
  else {
    h += `<p class="small muted">${t('logInfo', { d: r.log.date || '?', n: r.log.lines })}</p>`;
    if (!r.log.errors.length) h += `<div class="item ok">${t('lErrNone')}</div>`;
    else {
      h += `<h2 style="font-size:15px">${t('lErrTitle')}</h2>`;
      for (const mod in r.log.errorsByMod) h += `<div class="item bad"><b>${esc(mod)} - ${r.log.errorsByMod[mod]}x</b><span class="small muted">${esc((r.log.errors.find(e => e.mod === mod) || {}).line || '')}</span></div>`;
    }
    h += `<p class="small muted" style="margin-top:12px">${t('lLast')}</p><pre class="small" style="white-space:pre-wrap;background:var(--card2);padding:8px;border-radius:8px;overflow:auto">${esc(r.log.last.join('\n'))}</pre>`;
  }
  h += `</div>`;

  h += `<div class="card"><h2>${t('crashTitle')}</h2>`;
  if (!r.crashes || !r.crashes.length) h += `<div class="item ok">${t('crashNone')}</div>`;
  else {
    const shown = r.crashes.slice(0, 10);
    if (r.crashes.length > shown.length) h += `<p class="small muted">${t('crashRecent', { n: shown.length })}</p>`;
    h += `<div class="tbl"><table><tr><th>${t('cWhen')}</th><th>${t('cAfter')}</th><th>${t('cWhat')}</th><th>${t('cWhere')}</th></tr>`;
    for (const c of shown) {
      const what = c.kind === 'access' ? t('wAccess') : c.kind === 'cpp' ? t('wCpp') : t('wOther');
      h += `<tr><td class="small">${fmtDate(c.when)}</td><td>${fmtPlayed(c.secs)}</td><td class="small">${what}</td><td class="small">${c.inUe4ss ? `<span class="pill warn">UE4SS</span> ${t('whereUe4ss')}` : t('whereGame')}</td></tr>`;
    }
    h += `</table></div>`;
  }
  h += `</div>`;

  h += `<div class="card"><h2>${t('diagTitle')}</h2><ol><li>${t('d1')}</li><li>${t('d2')}</li><li>${t('d3')}</li></ol></div>`;
  h += `<p class="small muted">${t('footer')}</p>`;
  R.innerHTML = h;
}

/* ---------- main flow ---------- */
async function runScan() {
  if (!gameDir) return;
  const R = document.getElementById('results'); R.classList.remove('hide'); R.innerHTML = `<div class="card muted">${t('scanning')}</div>`;
  try {
    const ue4ss = await findUe4ss(gameDir);
    const { mods, modsTxt } = ue4ss ? await scanUe4ssMods(ue4ss) : { mods: [], modsTxt: {} };
    const pak = await scanPaks(gameDir);
    const logText = ue4ss ? await readText(ue4ss, 'UE4SS.log') : null;
    const log = logText ? analyzeLog(logText) : null;
    const crashes = crashDir ? await scanCrashes(crashDir) : null;
    const problems = findProblems(mods, modsTxt, log, crashes, !!ue4ss);
    lastReport = { mods, pak, log, crashes, problems };
    render(lastReport);
  } catch (e) { console.error(e); await checkServer(); }
}
async function loadInfo() {
  INFO = await (await api('/api/info')).json();
  gameDir = INFO.game ? new RDirHandle('game', '') : null;
  crashDir = INFO.crash ? new RDirHandle('crash', '') : null;
  renderGameCard();
  if (gameDir) await runScan(); else document.getElementById('results').classList.add('hide');
}
async function pickOther() {
  cardMsg = 'picking'; renderGameCard();
  document.getElementById('btnPick').disabled = true;
  try {
    const r = await (await api('/api/pick', {}, { method: 'POST' })).json();
    cardMsg = r.picked && !r.valid ? 'pickInvalid' : '';
    await loadInfo();
  } catch (e) { await checkServer(); }
}
async function checkServer() {
  try { await api('/api/ping'); } catch (e) { serverGone = true; document.getElementById('results').classList.add('hide'); }
  renderGameCard();
}

function applyLang() {
  document.documentElement.lang = LANG === 'pt' ? 'pt-BR' : 'en';
  document.getElementById('lang-pt').classList.toggle('on', LANG === 'pt');
  document.getElementById('lang-en').classList.toggle('on', LANG === 'en');
  document.getElementById('tagline').textContent = t('tagline');
  renderGameCard();
}
async function setLang(l) {
  LANG = l; try { localStorage.setItem('moddoctor-lang', l); } catch (e) {}
  applyLang();
  if (lastReport) await runScan();   // problems are re-generated in the new language
}
/* inside the program's own window, web links open in the normal browser */
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="http"]');
  if (a && typeof window.mdOpen === 'function') { e.preventDefault(); window.mdOpen(a.href); }
});
applyLang();
loadInfo().catch(checkServer);
setInterval(() => { if (!serverGone) api('/api/ping').catch(checkServer); }, 15000);

/* test hook (used by automated tests only) */
window.__md = { runScan, get report() { return lastReport; }, get info() { return INFO; }, setLang };
</script>
